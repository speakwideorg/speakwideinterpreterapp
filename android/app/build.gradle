apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

task generateFirebaseConfig(type: Exec) {
    commandLine 'node', "${project.rootDir}/../scripts/generate-firebase-config.js"
}
tasks.matching { it.name.startsWith("process") && it.name.endsWith("GoogleServices") }.configureEach {
    dependsOn generateFirebaseConfig
}

apply plugin: 'com.google.gms.google-services'

react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def envFile = file("${rootDir}/../.env")
def envVars = [:]
if (envFile.exists()) {
    envFile.readLines().each { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith("#")) {
            def parts = trimmed.split("=", 2)
            if (parts.length == 2) {
                def k = parts[0].trim()
                def v = parts[1].trim()
                if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) {
                    v = v.substring(1, v.length() - 1)
                }
                envVars.put(k, v)
            }
        }
    }
}
def googleMapsApiKey = System.getenv("GOOGLE_MAPS_API_KEY") ?: envVars.get("GOOGLE_MAPS_API_KEY", "")

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.speakwideinterpreter"
    defaultConfig {
        applicationId "com.speakwideinterpreter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.7"
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: googleMapsApiKey
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('SPEAKWIDE_RELEASE_STORE_FILE')) {
                storeFile file(SPEAKWIDE_RELEASE_STORE_FILE)
                storePassword SPEAKWIDE_RELEASE_STORE_PASSWORD
                keyAlias SPEAKWIDE_RELEASE_KEY_ALIAS
                keyPassword SPEAKWIDE_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    //  Persona SDK
    implementation("com.withpersona.sdk2:inquiry:2.21.0")
    
    // Notifee dependencies
    implementation(project(':notifee_react-native'))

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
